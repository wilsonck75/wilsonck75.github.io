# School-name and classification taxonomy for the Powering Potential dashboard.
#
# This file is the single reviewable source for the judgment calls baked into
# build_program_data.py: which raw spreadsheet spellings map to which
# canonical school, which schools count toward the "Karatu 23", and which
# schools are intentionally excluded from the active network.
#
# Edit this file (not build_program_data.py) when:
#   - a new misspelling/variant of a school name shows up in the timeline
#   - PEF confirms an addition/removal from the Karatu 23 list
#   - a school's tracked/not-tracked status changes
#
# Every entry should carry a `reason` (why the call was made) and, where
# possible, a `confirmed_by` (who signed off) so a board member can audit
# these choices without reading Python. Re-run build_program_data.py after
# editing this file to regenerate program-data.js.

# Raw (lowercased) spreadsheet spellings -> canonical display name.
name_aliases:
  banjika: {canonical: "Banjika", reason: "Alternate spelling in By Date sheet."}
  banjka: {canonical: "Banjika", reason: "Typo in By Date sheet."}
  "mlimani sumawe": {canonical: "Mlimani Sumawe", reason: "Canonical spelling."}
  "mlimani sumwae": {canonical: "Mlimani Sumawe", reason: "Typo in By Date sheet."}
  "mlimane sumawe": {canonical: "Mlimani Sumawe", reason: "Typo in By Date sheet."}
  rigicha: {canonical: "Rigicha", reason: "Canonical spelling."}
  rigichia: {canonical: "Rigicha", reason: "Typo in By Date sheet."}
  soitsambu: {canonical: "Soit Sambu", reason: "Spelling variant (no space)."}
  "soit sambu": {canonical: "Soit Sambu", reason: "Canonical spelling."}
  slahamo: {canonical: "Slahamo", reason: "Canonical spelling."}
  slahhamo: {canonical: "Slahamo", reason: "Typo in By Date sheet."}
  endallah: {canonical: "Endallah", reason: "Canonical spelling."}
  endalah: {canonical: "Endallah", reason: "Typo in By Date sheet."}
  olturoto: {canonical: "Olturoto", reason: "Canonical spelling."}
  olturotu: {canonical: "Olturoto", reason: "Typo in By Date sheet."}
  "olturoto primary school": {canonical: "Olturoto", reason: "Long form used in one row."}
  nainokanoka: {canonical: "Nainokanoka", reason: "Canonical spelling."}
  "lake natron": {canonical: "Lake Natron", reason: "Canonical spelling."}
  "san francisco rio itaya (peru)": {canonical: "San Francisco Rio Itaya", reason: "Country suffix dropped for canonical name."}
  "san francisco rio itaya": {canonical: "San Francisco Rio Itaya", reason: "Canonical spelling."}

# Rows whose "school" text is actually a group/meta label, not a single
# school. These rows are dropped from the school roster (their activity is
# still counted where a real school name is also present in the row).
meta_labels:
  - value: "16 schools"
    reason: "Zanzibar bundle label, not a single school; Zanzibar schools are enumerated separately below."
  - value: "zanzibar – 16 schools"
    reason: "Zanzibar bundle label (en dash variant)."
  - value: "zanzibar-16 schools"
    reason: "Zanzibar bundle label (hyphen variant)."
  - value: "zanzibar-training"
    reason: "Zanzibar bundle label."
  - value: "karatu district project year 1 schools"
    reason: "Group label for the KDP1 cohort, not a single school."
  - value: "banjika (students from banjika and other district schools)"
    reason: "Descriptive label, not a distinct school."

# Special-case text substitutions that don't fit the alias table.
text_substitutions:
  - match: "7 districts"
    canonical: "Charawe"
    reason: "One row uses the district-summary label instead of a Zanzibar school name; Charawe is the intended row per the Zanzibar Schools sheet ordering."
  - match_contains: "for all 12 karatu"
    canonical: null
    reason: "Summary/rollup row across 12 Karatu schools, not a single school; dropped from the roster."

# The 16 Zanzibar Pi-oneer schools, used as a fallback if the "Zanzibar
# Schools" sheet in the workbook doesn't parse to at least 16 rows.
zanzibar_schools_fallback:
