# The original 6 PPI Karatu schools: the installed base. Per AJ Poole's Key
# tab, these are NOT counted in the "Karatu 23" denominator.
original_karatu:
  schools: ["Banjika", "Welwel", "Florian", "Slahamo", "Endallah", "Baray"]
  reason: "AJ Poole Key tab, 2026: original 6 Karatu labs are the installed base, distinct from the 23 schools still targeted for KDP installs."
  confirmed_by: "AJ Poole (board), per meeting with Albin"

# Karatu 23 progress: schools named in the equipment file as KDP1/KDP2
# installs. This is the "11 of 23" equipment-file definition; the
# implementation timeline names only 6 of the 7 KDP1 schools (Gyekrum
# Arusha is missing from the By Date sheet).
kdp1_named:
  schools: ["Mlimani Sumawe", "Domel", "Endabash", "Chaenda", "Oldeani", "Upper Kitete"]
  reason: "6 of 7 KDP1 schools present on the By Date sheet; Gyekrum Arusha is the 7th per the equipment file and 2023 Addax & Oryx proposal but has no logged install row."
  confirmed_by: "Equipment file (PROGRAM EQUIPMENTS_2008-2023.xlsx); cross-checked against 2023 AOF proposal"

kdp2_named:
  schools: ["Diego", "Kilimatembo", "Kilimamoja", "Marang"]
  reason: "2025 SPARC+ installs logged in the By Date sheet; no training rows yet as of the last extract."
  confirmed_by: "Equipment file (PROGRAM EQUIPMENTS_2008-2023.xlsx)"

# Schools intentionally excluded from the active network, with the reason
# recorded so this doesn't get silently "fixed" by a future data refresh.
not_tracked:
  Noonkodin:
    reason: "Solar system damaged; no longer tracked (2023 proposal)."
  Olturoto:
    reason: "Primary-school training only; no lab."
  Shimbwe:
    reason: "Lab was not maintained; no longer tracked."
  Mgutwa:
    reason: "Pi-oneer one-off for a donor; no longer tracked."

