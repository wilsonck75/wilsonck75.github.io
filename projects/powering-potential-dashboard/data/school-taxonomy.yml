  - {name: "Jongowe", region: "North Unguja", district: "North A Unguja"}
  - {name: "Kandwi", region: "North Unguja", district: "North A Unguja"}
  - {name: "Kidoti", region: "North Unguja", district: "North A Unguja"}
  - {name: "Kijini", region: "North Unguja", district: "North A Unguja"}
  - {name: "Mbuyutende", region: "North Unguja", district: "North A Unguja"}
  - {name: "Pwani Mchangani", region: "North Unguja", district: "North A Unguja"}
  - {name: "Tumbatu", region: "North Unguja", district: "North A Unguja"}
  - {name: "Charawe", region: "South Unguja", district: "Central Unguja"}
  - {name: "Ukongoroni", region: "South Unguja", district: "Central Unguja"}
  - {name: "Uzi", region: "South Unguja", district: "Central Unguja"}
