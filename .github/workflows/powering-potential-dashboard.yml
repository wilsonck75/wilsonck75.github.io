name: Powering Potential Dashboard

# Guards the data pipeline behind the Program dashboard: reruns the
# xlsx -> program-data.js build and fails if the committed file wasn't
# regenerated from the current taxonomy/timeline, runs the golden-value
# and data-quality tests, and syntax-checks the extracted JS/CSS bundle.
on:
  push:
    branches:
      - main
    paths:
      - "projects/powering-potential-dashboard/**"
      - ".github/workflows/powering-potential-dashboard.yml"
  pull_request:
    paths:
      - "projects/powering-potential-dashboard/**"
      - ".github/workflows/powering-potential-dashboard.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/powering-potential-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (for JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run data-pipeline tests (golden values + duplicate-name gate)
        run: python3 -m pytest tests/ -v
        # This includes test_committed_program_data_matches_fresh_build,
        # which reruns build_program_data.py in-process and compares the
        # result against the committed program-data.js (ignoring the
        # generatedAt timestamp, which legitimately changes every run).
        # That's the drift check for program-data.js; a plain `git diff`
        # after rewriting the file would false-positive on the timestamp.

      - name: Rebuild dashboard.css / dashboard.js and fail on drift
        run: |
          python3 assemble_index.py
          if ! git diff --quiet -- dashboard.css dashboard.js; then
            echo "::error::dashboard.css or dashboard.js is out of date. Run 'python3 assemble_index.py' locally (after editing workbench-original.html, program-extra.css, or program.js) and commit the result." >&2
            git diff -- dashboard.css dashboard.js | head -200
            exit 1
          fi

      - name: Syntax-check dashboard.js
        run: node --check dashboard.js

      - name: Syntax-check dashboard-data.js and program-data.js
        run: |
          node --check dashboard-data.js
          node --check program-data.js
